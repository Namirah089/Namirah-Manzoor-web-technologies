<!doctype html>
<html lang="en">
  <head>
    <title>Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">MyStore</div>
      <button
        class="hamburger"
        onclick="
          document.querySelector('.nav-links').classList.toggle('active')
        "
      >
        &#9776;
      </button>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <div class="cart">&#128722;</div>
    </nav>
    <main class="product-grid">
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Product" />
        <h3>Product 1</h3>
        <p>$10.00</p>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Product" />
        <h3>Product 2</h3>
        <p>$20.00</p>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Product" />
        <h3>Product 3</h3>
        <p>$30.00</p>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Product" />
        <h3>Product 4</h3>
        <p>$40.00</p>
      </div>
    </main>
  </body>
</html>
