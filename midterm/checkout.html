<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodpanda - Checkout</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      @media (min-width: 689px) {
        .checkout-container {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }
        .form-group {
          display: grid;
          grid-template-columns: 120px 1fr;
          align-items: center;
          gap: 10px;
          margin-bottom: 15px;
        }
      }

      @media (max-width: 688px) {
        .form-group {
          display: flex;
          flex-direction: column; /* Label stacked above input */
          margin-bottom: 15px;
        }
      }

      input:user-invalid,
      select:user-invalid {
        border: 2px solid red !important;
      }

      .error-msg {
        display: none;
        color: red;
        font-size: 0.85rem;
      }

      input:user-invalid + .error-msg,
      select:user-invalid + .error-msg {
        display: block; /* Show short error message when field is invalid */
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-dark px-3"
      style="background-color: rgb(216, 9, 109)"
    >
      <a class="navbar-brand" href="index.html" style="color: pink"
        >Foodpanda</a
      >
      <div>
        <a class="text-white text-decoration-none me-3" href="index.html"
          >Home</a
        >
        <a class="text-white text-decoration-none me-3" href="product.html"
          >Product Detail</a
        >
      </div>
      <a href="checkout.html" class="btn btn-outline-light">🛒 Cart (0)</a>
    </nav>

    <main class="container my-4">
      <h1 class="text-center mb-4" style="color: rgb(216, 9, 109)">Checkout</h1>

      <form action="#" method="POST">
        <div class="checkout-container">
          <fieldset class="border p-3 rounded">
            <legend
              class="float-none w-auto px-2 fw-bold"
              style="color: hsl(263, 70%, 45%)"
            >
              Contact
            </legend>

            <div class="form-group">
              <label for="fullname">Full Name:</label>
              <div>
                <input
                  type="text"
                  id="fullname"
                  name="fullname"
                  class="form-control"
                  required
                  placeholder="John Doe"
                />
                <span class="error-msg">Please enter your full name.</span>
              </div>
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <div>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  required
                  placeholder="name@example.com"
                />
                <span class="error-msg">Please enter a valid email.</span>
              </div>
            </div>

            <div class="form-group">
              <label for="phone">Phone:</label>
              <div>
                <input
                  type="text"
                  id="phone"
                  name="phone"
                  class="form-control"
                  required
                  pattern="03[0-9]{2}-[0-9]{7}"
                  placeholder="03XX-XXXXXXX"
                />
                <span class="error-msg">Format must be 03XX-XXXXXXX.</span>
              </div>
            </div>
          </fieldset>

          <fieldset class="border p-3 rounded">
            <legend
              class="float-none w-auto px-2 fw-bold"
              style="color: hsl(263, 70%, 45%)"
            >
              Delivery
            </legend>

            <div class="form-group">
              <label for="address">Address:</label>
              <div>
                <input
                  type="text"
                  id="address"
                  name="address"
                  class="form-control"
                  required
                  placeholder="House #, Street..."
                />
                <span class="error-msg">Address is required.</span>
              </div>
            </div>

            <div class="form-group">
              <label for="city">City:</label>
              <div>
                <select id="city" name="city" class="form-select" required>
                  <option value="">Select City</option>
                  <option value="lahore">Lahore</option>
                  <option value="islamabad">Islamabad</option>
                  <option value="karachi">Karachi</option>
                </select>
                <span class="error-msg">Please select a city.</span>
              </div>
            </div>

            <div class="form-group">
              <label for="date">Delivery Date:</label>
              <div>
                <input
                  type="date"
                  id="date"
                  name="date"
                  class="form-control"
                  required
                  min="2026-10-29"
                  max="2027-01-26"
                />
                <span class="error-msg"
                  >Date must be between today and 89 days later.</span
                >
              </div>
            </div>
          </fieldset>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4 py-2">
          Place Order
        </button>
      </form>
    </main>

    <footer
      class="text-white text-center py-3 mt-5"
      style="background-color: rgb(216, 9, 109)"
    >
      <p class="mb-0">&copy; 2026 My Store. All rights reserved.</p>
    </footer>
  </body>
</html>
