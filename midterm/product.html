<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodpanda - Product Detail</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-dark px-3"
      style="background-color: rgb(216, 9, 109)"
    >
      <a class="navbar-brand" href="index.html" style="color: pink"
        >Foodpanda</a
      >
      <div>
        <a class="text-white text-decoration-none me-3" href="index.html"
          >Home</a
        >
        <a class="text-white text-decoration-none me-3" href="product.html"
          >Product Detail</a
        >
      </div>
      <button class="btn btn-outline-light">🛒 Cart (0)</button>
    </nav>

    <main class="container my-5">
      <div class="row align-items-center">
        <div class="col-12 col-md-6 mb-4 mb-md-0 text-center">
          <img
            src="https://via.placeholder.com/400"
            class="img-fluid rounded"
            alt="Product Image"
          />
        </div>

        <div class="col-12 col-md-6">
          <h1>Product 1</h1>
          <h2 class="text-success">$19.99</h2>
          <p>
            This is a simple description of the product explaining key features
            and specifications.
          </p>

          <div class="mb-3">
            <label for="quantity" class="fw-bold">Quantity:</label>
            <input
              type="number"
              id="quantity"
              class="form-control d-inline-block w-auto ms-2"
              value="1"
              min="1"
            />
          </div>

          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </main>

    <footer
      class="bg- text-white text-center py-3 mt-5"
      style="background-color: rgb(216, 9, 109)"
    >
      <p class="mb-0">&copy; 2026 My Store. All rights reserved.</p>
    </footer>
  </body>
</html>
